# The scheme the client actually used. Behind a TLS-terminating proxy this
# server only ever sees plain HTTP, so $scheme would tell the API "http" and
# every absolute link it writes — the e-reader catalog's, above all — would
# point at a URL the edge redirects. Trust a forwarded proto when one
# arrived; fall back to our own scheme when this is the edge.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Likewise the host, port included: $host drops the port, and a LAN install
# at http://10.0.0.5:3000 would otherwise hand out links to port 80.
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen       80;
    # Bind IPv6 too: inside the container "localhost" resolves to ::1 first, so
    # an IPv4-only listener makes the healthcheck fail against a working server.
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Covers are large; everything else is small JSON.
    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # The OCR runtime: a few megabytes of WASM core and English model,
    # vendored out of node_modules at build time so the page scanner never
    # touches a CDN. The filenames are versioned by npm rather than by
    # content, so these get a month and a revalidation instead of the
    # immutable year below — long enough that a phone downloads the model
    # once, short enough that a Tesseract upgrade actually reaches anyone.
    location /assets/ocr/ {
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Hashed asset filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to a stale
    # bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files  $uri =404;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $forwarded_host;

        # Cover downloads can stall on a slow upstream CDN on first request.
        proxy_read_timeout 60s;
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
