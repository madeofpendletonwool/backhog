<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced at runtime with the active theme's --c-950 (useTheme.tsx). -->
    <meta name="theme-color" content="#08080a" />
    <title>Backhog</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />

    <!-- Stamp the saved theme before the first paint. Without this the
         page renders one frame of the CSS defaults (the arcade cabinet)
         before React mounts and corrects it, which reads as a flash of
         the wrong app. The id -> family map mirrors THEMES in
         src/hooks/useTheme.tsx; keep the two in step. -->
    <script>
      (function () {
        var FAMILY = {
          midnight: "flat",
          arcade: "pixel",
          dusk: "pixel",
          cavern: "pixel",
          forest: "pixel",
          bare: "pixel",
        };
        var theme;
        try {
          theme = localStorage.getItem("backhog:theme");
        } catch (e) {
          /* private browsing — fall through to the default */
        }
        if (!FAMILY[theme]) theme = "midnight";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.family = FAMILY[theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
