services:
  api:
    build: ./api
    environment:
      DATABASE_PATH: /data/backhog.db
      COVER_DIR: /data/covers
      # EPUB canonical texts and their offset indexes: same volume as the
      # database and covers, so a single backhog-data mount covers everything.
      EPUB_TEXT_DIR: /data/epub_text
      APP_ENV: production
      # Leave false for plain HTTP on a LAN address; browsers discard Secure
      # cookies on non-HTTPS origins, which breaks login. Set true only when
      # serving through an HTTPS reverse proxy.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Get these from https://dev.twitch.tv/console/apps — see README.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      # Optional: enables bulk import of an owned Steam library.
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Optional: Books arena library roots, colon-separated. The paths are
      # container-side and must match the read-only bind mounts below.
      MEDIA_DIR: ${MEDIA_DIR:-}
      # Optional: shared secret for the alignment worker container. Set it
      # (here and identically in the worker) to enable the /internal
      # alignment API; leave it empty and alignment stays off — reading,
      # listening and tracking all work without it. Never logged.
      ALIGN_WORKER_TOKEN: ${ALIGN_WORKER_TOKEN:-}
    volumes:
      - backhog-data:/data
      # Books arena: bind-mount the NAS library read-only, one entry per
      # MEDIA_DIR root. Nothing under these mounts is ever written to.
      # - /mnt/nas/audiobooks:/media/audiobooks:ro
      # - /mnt/nas/ebooks:/media/ebooks:ro
    healthcheck:
      # The distroless image has no shell, so the binary probes itself.
      test: ["CMD", "/app/backhog", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      # Only nginx is published; the API stays on the internal network.
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # The optional alignment worker. It is behind a compose profile, so a
  # plain `docker compose up` never builds or pulls this multi-GB image;
  # `docker compose --profile align up` opts in. Everything in the Books
  # arena works without it — alignment jobs just stay queued.
  align:
    profiles: ["align"]
    build:
      context: ./align
      args:
        # The model is baked into the image, so switching it is a
        # rebuild (`--profile align build`), not a restart. Sizes and
        # the accuracy/speed trade are documented in align/Dockerfile.
        WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    environment:
      BACKHOG_API_URL: http://api:8080
      # Must be the same value as the api service above, and non-empty:
      # an empty token disables the /internal API the worker claims from.
      ALIGN_WORKER_TOKEN: ${ALIGN_WORKER_TOKEN:-}
      # Leave unset to use every core the container is allowed.
      WHISPER_THREADS: ${WHISPER_THREADS:-}
    volumes:
      # Read-only, exactly like the api service: the worker reads the
      # audiobooks and the canonical EPUB text, and writes neither.
      - backhog-data:/data:ro
      # Books arena: the same NAS mounts the api service gets, at the
      # same container paths — the API hands over absolute paths, so
      # they have to mean the same thing in both containers.
      # - /mnt/nas/audiobooks:/media/audiobooks:ro
      # - /mnt/nas/ebooks:/media/ebooks:ro
      # Scratch for one chunk of decoded audio at a time (~19 MB).
      - align-scratch:/scratch
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # No shell in the way; the binary probes its own status endpoint.
      test: ["CMD", "/app/align-worker", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # A worker killed mid-book leaves its claim to go stale; the API
    # reclaims it and the restarted worker picks the job back up.
    restart: unless-stopped

volumes:
  backhog-data:
  align-scratch:
